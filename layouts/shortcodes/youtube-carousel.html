<div class="yt-carousel">
  <div class="yt-carousel-track" id="yt-carousel-track">
    <p style="opacity: 0.5;">Loading videos...</p>
  </div>
</div>

<style>
.yt-carousel {
  overflow: hidden;
  position: relative;
  margin: 1.5rem 0;
}

.yt-carousel-track {
  display: flex;
  gap: 1rem;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: #444 transparent;
  padding-bottom: 0.5rem;
}

.yt-carousel-track::-webkit-scrollbar {
  height: 6px;
}

.yt-carousel-track::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 3px;
}

.yt-card {
  flex: 0 0 280px;
  text-decoration: none;
  transition: transform 0.2s ease;
}

.yt-card:hover {
  transform: translateY(-3px);
}

.yt-card img {
  width: 280px;
  height: 158px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid #333;
}

.yt-card-title {
  margin-top: 0.4rem;
  font-size: 0.85rem;
  color: #ccc;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 280px;
}
</style>

<script>
(function() {
  const channelId = 'UCw58yj_-WS-MW-Fu7H3gWqw';
  const rssUrl = `https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;

  fetch(rssUrl)
    .then(res => res.json())
    .then(data => {
      const track = document.getElementById('yt-carousel-track');
      if (!data.items || data.items.length === 0) {
        track.innerHTML = '<p style="opacity:0.5;">No videos found.</p>';
        return;
      }
      const videos = data.items.slice(0, 4);
      track.innerHTML = videos.map(video => {
        let videoId = '';
        if (video.link.includes('v=')) {
          videoId = video.link.split('v=')[1].split('&')[0];
        } else if (video.link.includes('/shorts/')) {
          videoId = video.link.split('/shorts/')[1].split('?')[0];
        } else {
          videoId = video.guid.split(':').pop();
        }
        const thumbnail = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
        return `
          <a class="yt-card" href="${video.link}" target="_blank" rel="noopener">
            <img src="${thumbnail}" alt="${video.title}" loading="lazy">
            <div class="yt-card-title">${video.title}</div>
          </a>
        `;
      }).join('');
    })
    .catch(() => {
      document.getElementById('yt-carousel-track').innerHTML =
        '<p style="opacity:0.5;">Could not load videos.</p>';
    });
})();
</script>
