<header class="header">
  <div class="header__inner">
    <div class="header__logo">
      {{ partial "logo.html" . }}
    </div>
    <div class="header__toggles">
      <button id="theme-toggle" class="toggle-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
        <span class="toggle-icon" id="theme-icon">◐</span>
      </button>
      <button id="hacker-toggle" class="toggle-btn" title="Hacker Mode (Ctrl+H)" aria-label="Toggle hacker mode">
        <span class="toggle-icon">&gt;_</span>
      </button>
    </div>
    {{ if len $.Site.Menus }}
      {{ partial "mobile-menu.html" . }}
    {{ end }}
    {{ if and $.Site.Params.showLanguageSelector (len $.Site.Home.AllTranslations) }}
      {{ partial "language-menu.html" . }}
    {{ end }}
  </div>
  {{ if len $.Site.Menus }}
    {{ partial "menu.html" . }}
  {{ end }}
</header>

<!-- Hacker Mode: Bottom Command Bar Overlay -->
<div id="hacker-overlay" class="hacker-overlay" style="display:none;">
  <div class="hacker-overlay__suggestions" id="command-suggestions"></div>
  <div class="hacker-overlay__bar">
    <span class="command-prompt">~$</span>
    <input type="text" id="command-input" class="command-input" placeholder="type a command..." autocomplete="off" spellcheck="false" />
    <span class="command-hint" id="command-ghost"></span>
  </div>
</div>
